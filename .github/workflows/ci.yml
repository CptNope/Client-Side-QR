name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to exact commits (tags can be moved).
# checkout v5 = fbc6f39…, setup-php v2 = eb7c497…, plugin-check-action v1.1.9 = 10857da…,
# upload-artifact v4.6.2 = ea165f8…

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          V=$(sed -n 's/^ \* Version: *//p' client-side-qr.php | tr -d '[:space:]')
          grep -q "define( 'CSQR_VERSION', '$V' );" client-side-qr.php || { echo "::error file=client-side-qr.php::CSQR_VERSION isn't $V."; exit 1; }
          grep -q "^Stable tag: $V$" readme.txt || { echo "::error file=readme.txt::readme.txt Stable tag isn't $V."; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::CHANGELOG.md has no entry for $V."; exit 1; }

  plugin-check:
    name: WordPress.org Plugin Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build the WordPress.org zip
        run: bash tools/build-wporg.sh build
      # The same checks the WordPress.org review team runs.
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
        with:
          build-dir: './build/anderson-qr-code-generator'
          slug: 'anderson-qr-code-generator'

  e2e:
    name: Browser tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SITE: ${{ github.workspace }}/../site
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: gd, mysqli
          tools: wp-cli
          coverage: none
      - name: Build the WordPress.org zip
        run: bash tools/build-wporg.sh build
      - name: Install WordPress with the built plugin
        run: |
          mkdir -p "$SITE"
          wp core download --path="$SITE" --quiet
          wp config create --path="$SITE" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          # PHP's test server is single-threaded; WP-Cron's loopback would stall page assets.
          wp config set DISABLE_WP_CRON true --raw --path="$SITE"
          wp core install --path="$SITE" --url="$BASE" --title="Test site" --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email --quiet
          wp plugin install build/anderson-qr-code-generator.zip --activate --path="$SITE"
          wp rewrite structure '/%postname%/' --path="$SITE"
          WP="wp --path=$SITE" bash tests/e2e/setup.sh "$RUNNER_TEMP/fixtures.json"
      - name: Start the site
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t "$SITE" tests/e2e/router.php > "$RUNNER_TEMP/php.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$BASE/" && break; sleep 1; done
          curl -fsS -o /dev/null "$BASE/" || { cat "$RUNNER_TEMP/php.log"; exit 1; }
          # The tests use this logo; say plainly if it can't be served.
          LOGO=$(jq -r .logo "$RUNNER_TEMP/fixtures.json")
          echo "::notice title=Test logo::$(curl -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download} bytes' "$LOGO" 2>&1) $LOGO"
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: CSQR_FIXTURES="$RUNNER_TEMP/fixtures.json" CSQR_SHOTS="$RUNNER_TEMP/shots" node tests/e2e/run.cjs "$BASE" admin password
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
